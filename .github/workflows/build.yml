name: build

on:
  push:
  pull_request:

jobs:
  compile:
    # Compiles everything that does not need the game jar. The game itself is
    # never in this repository, so a full APK can only be built locally.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk-headless android-sdk-platform-23 libasm-java liblwjgl-java
      - name: Compile tools
        run: |
          ASM=/usr/share/java/asm.jar:/usr/share/java/asm-commons.jar:/usr/share/java/asm-tree.jar
          mkdir -p build/tools
          javac -nowarn -cp $ASM -d build/tools tools/Remap.java tools/Check.java
      - name: Compile shim (against Android API 23)
        run: |
          mkdir -p build/shim-classes
          javac -nowarn -source 8 -target 8 -bootclasspath /usr/lib/android-sdk/platforms/android-23/android.jar \
            -d build/shim-classes $(find shim/src -name '*.java')
      - name: Compile Android code
        run: |
          mkdir -p build/android-classes
          javac -nowarn -source 8 -target 8 -bootclasspath /usr/lib/android-sdk/platforms/android-23/android.jar \
            -cp build/shim-classes -d build/android-classes $(find android/src -name '*.java')
      - name: Compile desktop test harness
        run: |
          mkdir -p build/desk-classes
          javac -nowarn -d build/desk-classes -cp build/shim-classes:/usr/share/java/lwjgl.jar $(find desktop/src -name '*.java')
